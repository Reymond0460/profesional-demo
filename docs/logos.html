<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Propuestas de logo</title>
<style>body{font-family:system-ui,sans-serif;margin:0;padding:2rem;background:#faf8f5;color:#14201f}
.fila{display:flex;flex-wrap:wrap;gap:2rem}.caja{padding:1.5rem;border-radius:16px;border:1px solid #e7e0d3;width:260px}
.oscuro{background:#082423;color:#faf8f5}svg{width:72px;height:72px;display:block;margin-bottom:.75rem}h2{margin:2rem 0 .5rem}</style></head>
<body><h1>Propuestas de logo (insignias SVG)</h1><p>Cada una se ve sobre fondo claro y oscuro. La demo usa la A.</p>
<div class="fila" id="f"></div>
<script>
const logos={
 'A · Monograma en círculo':'<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="30" fill="#1c5d58" stroke="#faf8f5" stroke-width="2"/><circle cx="32" cy="32" r="25" fill="none" stroke="#d9a441" stroke-width="1.5"/><text x="32" y="40" text-anchor="middle" font-family="Georgia,serif" font-size="22" font-weight="700" fill="#faf8f5">MS</text></svg>',
 'B · Cuadrado con M y línea':'<svg viewBox="0 0 64 64"><rect x="3" y="3" width="58" height="58" rx="14" fill="#1c5d58" stroke="#faf8f5" stroke-width="2"/><path d="M16 44V20l16 18 16-18v24" fill="none" stroke="#faf8f5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 51h32" stroke="#d9a441" stroke-width="3" stroke-linecap="round"/></svg>',
 'C · Hoja / brote':'<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="30" fill="#faf8f5" stroke="#1c5d58" stroke-width="3"/><path d="M32 50V26" stroke="#1c5d58" stroke-width="3" stroke-linecap="round"/><path d="M32 34c-9 0-14-6-14-14 9 0 14 6 14 14z" fill="#1c5d58"/><path d="M32 30c0-8 5-14 14-14 0 8-5 14-14 14z" fill="#d9a441"/></svg>'};
f.innerHTML=Object.entries(logos).map(([n,s])=>`<div class="caja">${s}<strong>${n}</strong></div><div class="caja oscuro">${s}<strong>${n}</strong></div>`).join('');
</script></body></html>
